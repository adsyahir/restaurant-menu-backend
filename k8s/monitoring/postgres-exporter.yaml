# Exposes Postgres metrics (connections, cache hit, throughput, locks) in
# Prometheus format. Reads DB creds from the same config/secret the app uses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: rms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_URI
              value: "postgres:5432/rms?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                configMapKeyRef: { name: rms-config, key: DB_USERNAME }
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: { name: rms-secret, key: DB_PASSWORD }
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: rms
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
