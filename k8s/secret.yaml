# Sensitive values. TEMPLATE: only ${VAR} placeholders (safe to commit).
# Values come from restaurant-menu-backend/.env via envsubst at apply time.
apiVersion: v1
kind: Secret
metadata:
  name: rms-secret
  namespace: rms
type: Opaque
stringData:
  APP_KEY: "${APP_KEY}"
  DB_PASSWORD: "${DB_PASSWORD}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
